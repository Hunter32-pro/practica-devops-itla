name: Notificacion Push a Main

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar programa Hola Mundo
        run: node app.js

      - name: Enviar notificacion a ntfy.sh
        if: always()
        run: |
          curl -d "Push realizado en main por ${{ github.actor }}. Commit: ${{ github.sha }}" https://ntfy.sh/devops-itla